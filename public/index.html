<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeatBubble - Premium Temperature Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
            opacity: 0.95;
        }
        
        .feature-list {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 30px;
            margin: 30px 0;
            backdrop-filter: blur(10px);
        }
        
        .feature-list h2 {
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .feature-list ul {
            list-style: none;
            text-align: left;
        }
        
        .feature-list li {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        
        .feature-list li:last-child {
            border-bottom: none;
        }
        
        .feature-list li::before {
            content: "✓ ";
            margin-right: 10px;
            font-weight: bold;
        }
        
        .badge {
            display: inline-block;
            background: rgba(255,193,7,0.9);
            color: #333;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌡️ HeatBubble</h1>
        <p>Real-time Temperature Tracking for Your Device</p>
        
        <div class="feature-list">
            <h2>Premium Features</h2>
            <ul>
                <li>Ad-free experience</li>
                <li>Hourly temperature charts & graphs</li>
                <li>Custom temperature alerts</li>
                <li>Advanced analytics & insights</li>
                <li>Enhanced home widget</li>
            </ul>
            <div class="badge">$2.99 or $1.99/month</div>
        </div>
        
        <p style="font-size: 0.9em; opacity: 0.8; margin-top: 40px;">
            Download on Google Play Store
        </p>
    </div>
</body>
</html>
